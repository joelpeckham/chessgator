name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare engine and model assets
        run: bun run prepare:assets

      - name: Verify asset checksums
        run: node scripts/prepare-assets.mjs --verify-only

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Knip
        run: bun run knip

      - name: Unit tests
        run: bun run test

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Stockfish browser smoke
        run: bun run test:stockfish

      - name: Maia browser smoke
        run: bun run test:maia

      - name: Production static build
        run: bun run build

      - name: Static host cache gate
        run: bun run test:static-host

      - name: E2E static build
        run: bun run build
        env:
          NEXT_PUBLIC_E2E: "1"

      - name: Playable flow e2e
        run: bunx playwright test -c tests/game/playwright.config.ts

      - name: Coaching flow e2e
        run: bunx playwright test -c tests/coaching/playwright.config.ts

      - name: Time-travel e2e
        run: bunx playwright test -c tests/time-travel/playwright.config.ts

      - name: Persistence e2e
        run: bunx playwright test -c tests/persistence/playwright.config.ts

      - name: Accessibility e2e
        run: bunx playwright test -c tests/accessibility/playwright.config.ts

      - name: Real composed shell smoke
        run: bunx playwright test -c tests/composed/playwright.config.ts
